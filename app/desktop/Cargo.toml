[package]
name = "v-synth-studio"
version = "1.3.0"
description = "V-Synth-Studio"
authors = ["QingMu"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP 服务：实现和 Node 后端完全相同的 39 个路由，前端零改动
axum = { version = "0.8", features = ["json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "time", "sync", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# 下载 / B 站解析 / 链接检查要用
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"

# B 站弹幕接口返回的是裸 deflate（没有 Content-Encoding 头），要自己解。
# 它本来就在依赖树里（tauri 带着 flate2），不是为这个功能新拉的。
flate2 = "1"

# 从 LibreSVIP 插件的 .yapsy-plugin 里读格式元数据（其实是个 INI）
# 不引 INI 库 —— 那个格式只有 key = value，自己解析十行就够

# 人声转 MIDI（GAME）：三个 ONNX 图由 ONNX Runtime 跑，宿主侧算法（切片、
# D3PM 采样环、边界解码、MIDI 写出）全是自己写的 Rust。
#
# 用 `load-dynamic` 而不是默认的 `download-binaries`：运行时动态库直接复用音轨
# 分离那份 `runtime/Lib/site-packages/onnxruntime/capi/onnxruntime.dll`，
# **不新下载、不额外占体积**，也就不会再往安装包里塞第二份 15 MB 的 ORT。
# 代价是进程里第一件事必须 `ort::init_from(<那个 dll 的绝对路径>)`（见
# `game/engine.rs::load_runtime`），否则建会话就 panic。
#
# ndarray 的版本必须和 `ort` 的 `ndarray` feature 转出来的那份完全一致，
# 否则 `Tensor::from_array` 会因为「两份 crate」而拒绝我们的数组。
#
# `cuda`（2026-10-04 加）：只为了拿到 `ort::ep::CUDA` 这个类型（它在 ort 里被
# `#[cfg(feature = "cuda")]` 整个门住）。**它不会把 CUDA 变成构建依赖** ——
# ort 的 cuda feature 只是打开 API，真正去 LoadLibrary 的是运行时，而且
# `ort-sys` 因为 `load-dynamic` 已经带上了 `disable-linking`，链接期不碰任何
# CUDA 库。所以 AMD 机器、没装 CUDA 的机器照样能用这个 exe，只是那一格锁着。
ort = { version = "2.0.0-rc.13", default-features = false, features = ["ndarray", "load-dynamic", "cuda"] }
ndarray = "0.17"

# 只有 Unix 下需要：给进程组发信号，把子进程树一起收掉
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 系统「下载」目录（读注册表 KNOWNFOLDERID，见 platform.rs）
# Win32_Globalization 只有一个用处：导入歌词时用 MultiByteToWideChar 把 GBK 转成
# UTF-8（国内老 LRC 有相当一部分是 GBK）。同一份 kernel32 绑定，不引编码库、不加体积。
# Win32_System_JobObjects：把分离引擎的 python.exe 放进作业对象，进程一死就带走它
# （见 svsep.rs 的 `job` 模块）—— 光靠 Drop 收不住「任务管理器强杀」那条路。
# 作业对象那套类型定义挂在 Threading 下，`CreateJobObjectW` 的参数又用了
# `SECURITY_ATTRIBUTES`（Win32_Security），三个 feature 都得开。
# Win32_UI_Controls_Dialogs：`GetOpenFileNameW`（系统「打开」文件对话框，
# 见 platform.rs 的 `pick_files`）—— 它顺带要 Win32_UI_Controls。
# Win32_UI_WindowsAndMessaging：对话框要挂在**自己窗口**前面，
# 用 `GetForegroundWindow` + `GetWindowThreadProcessId` 认领窗口。
# Win32_System_Com：`CoInitializeEx`（那套对话框在没起 COM 的线程上不保险）、
# `CoTaskMemFree`（`SHBrowseForFolderW` 回的 pidl 要还回去）。
# Win32_UI_Shell：`SHBrowseForFolderW` + `SHGetPathFromIDListW`（系统「选择文件夹」
# 对话框，见 platform.rs 的 `pick_folder`）；`BROWSEINFOW` 这个结构体本身挂在
# Win32_UI_Shell_Common 下，所以那个也要开。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
# 发布版压体积：这个外壳没有计算密集的活儿，压体积比压速度划算。
#
# 但不用 `lto = true` + `codegen-units = 1` —— 那是最慢的组合，
# 一千个依赖 crate 要编几十分钟，而体积只比 thin LTO 小几个百分点。
# thin LTO 拿到绝大部分收益，构建时间少一大截。
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
